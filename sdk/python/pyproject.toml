[project]
  name = "pulumi_doppler"
  description = "A Pulumi package for managing Doppler projects, secrets, and access."
  dependencies = ["packaging>=24.0", "pulumi>=3.0.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "doppler", "secrets", "secrets-management", "category/cloud"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.0.0a0+dev"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://www.doppler.com"
    Repository = "https://github.com/DopplerHQ/pulumi-doppler"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_doppler = ["py.typed", "pulumi-plugin.json"]
