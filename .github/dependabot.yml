# Version updates only for the test modules. Everything else is updated another way:
# - provider/ and sdk/: the upgrade-provider and upgrade-bridge workflows bump upstream, the
#   bridge and Pulumi, and regenerate the schema and SDKs, which Dependabot can't do.
# - GitHub Actions: workflows are generated by ci-mgmt (`make ci-mgmt`), which would
#   overwrite any pin Dependabot changes.
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/examples"
      - "/examples/core-go"
    schedule:
      interval: "weekly"
    groups:
      examples:
        patterns:
          - "*"
