template: external-bridged-provider
provider: doppler
organization: DopplerHQ
major-version: 0
providerDefaultBranch: main
upstreamProviderOrg: DopplerHQ
publishRegistry: false
# Upstream upgrade PRs wait for a human review instead of merging once CI passes.
autoMergeProviderUpgrades: false
# Workflows authenticate with the PULUMI_PROVIDER_AUTOMATION_TOKEN secret (a fine-grained
# token with contents, pull-requests and workflows write on this repo) rather than minting
# GitHub App tokens. The secret also lets automated upgrade PRs trigger CI, which PRs opened
# with GITHUB_TOKEN don't.
github-app:
    enabled: false
languages:
    - dotnet
    - go
    - nodejs
    - python
publish:
    sdk: "all,!java"
    cdn: false
# license:
#   ignore:
#     - github.com/apache/arrow/go/v15
#     - github.com/grafana/grafana-com-public-clients/go/gcom # Temporary while Grafana provider hasn't been upgraded yet
pulumiConvert: 1
